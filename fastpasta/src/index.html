<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The App</title>
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/home.css">
</head>
<body>
    <div class="app-layout">
        <!-- Сайд-бар -->
        <aside class="sidebar" id="sidebar">
            <!-- Кнопка сворачивания -->
            <button class="collapse-btn" id="collapseBtn" title="Свернуть меню">
                <span id="collapseIcon">‹</span>
            </button>
            <!-- Шапка -->
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24">
                        <img src="assets/logo.PNG" alt="logotype">
                    </svg>
                </div>
                <span class="app-name">FastPasta</span>
            </div>
            <!-- Основное меню -->
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active" title="Главная" data-page="home">
                    <svg viewBox="0 0 24 24">
                        <path d="m3 10 9-7 9 7"/>
                        <path d="M5 9v12h14V9"/>
                        <path d="M9 21v-7h6v7"/>
                    </svg>
                    <span>Главная</span>
                </a>
                <a href="#" class="menu-item" title="Поиск" data-page="search">
                    <svg viewBox="0 0 24 24">
                        <circle cx="10.5" cy="10.5" r="7"/>
                        <path d="m16 16 5 5"/>
                    </svg>
                    <span>Поиск</span>
                </a>
                <a href="#" class="menu-item" title="Статистика" data-page="stats">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M8 16v-4"/>
                        <path d="M12 16V8"/>
                        <path d="M16 16v-7"/>
                    </svg>
                    <span>Статистика</span>
                </a>
                <a href="#" class="menu-item" title="Заметки" data-page="notes">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
                        <path d="M14 2v6h6"/>
                        <path d="m9 15 2 2 4-4"/>
                    </svg>
                    <span>Заметки</span>
                </a>
                <a href="#" class="menu-item" title="Настройки" data-page="settings">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 21v-7"/>
                        <path d="M4 10V3"/>
                        <path d="M12 21v-9"/>
                        <path d="M12 8V3"/>
                        <path d="M20 21v-5"/>
                        <path d="M20 12V3"/>
                        <path d="M2 14h4"/>
                        <path d="M10 8h4"/>
                        <path d="M18 16h4"/>
                    </svg>
                    <span>Настройки</span>
                </a>
            </nav>
            <!-- Нижняя часть -->
            <div class="sidebar-footer">
                <div class="theme-switch">
                    <span class="theme-title">Тема</span>
                    <div class="theme-options">
                        <button
                            class="theme-option light-option"
                            id="lightTheme"
                            title="Светлая тема"
                            aria-label="Светлая тема">
                        </button>
                        <button
                            class="theme-option dark-option selected"
                            id="darkTheme"
                            title="Тёмная тема"
                            aria-label="Тёмная тема">
                        </button>
                    </div>
                </div>
            </div>
        </aside>
        <!-- Основной контент -->
        <main class="content">
            <div id="pageContent"></div>
        </main>
    </div>
    <script src="scripts/sidebar.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
